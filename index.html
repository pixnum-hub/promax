<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promax — AI Prompt Library</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12141a">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --bg:#12141a; --surface:#1b1e26; --surface2:#232733; --text:#eceef2; --muted:#9aa0b0;
  --accent:#8fa4ff; --accent-text:#0e0f14; --border:#2b2f3b; --star:#ffc857; --danger:#ff6b6b;
  --radius:10px;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:var(--sans); --mono:var(--sans);
}
body[data-theme="light"]{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#eeece5; --text:#1c1d22; --muted:#6b6f7c;
  --accent:#3d54c9; --accent-text:#ffffff; --border:#dcd9d0; --star:#b8860b;
}
body[data-theme="oled"]{
  --bg:#000000; --surface:#0a0a0c; --surface2:#131418; --text:#eceef2; --muted:#8b8f9c;
  --accent:#8fa4ff; --accent-text:#000000; --border:#1e1f24; --star:#ffc857;
}
body[data-theme="hc"]{
  --bg:#000000; --surface:#000000; --surface2:#000000; --text:#ffffff; --muted:#ffffff;
  --accent:#ffe600; --accent-text:#000000; --border:#ffffff; --star:#ffe600; --radius:2px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
body[data-theme="hc"] *{border-color:#fff!important;}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);
  padding:14px 16px 10px;}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.brand{font-family:var(--serif);font-size:22px;letter-spacing:.3px;margin:0;}
.brand span{color:var(--accent);}
.subtitle{font-size:12px;color:var(--muted);margin:2px 0 12px;font-family:var(--mono);}
.theme-toggle{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;flex-shrink:0;}
.theme-toggle button{border:none;background:var(--surface);color:var(--muted);font-size:11px;
  font-family:var(--mono);padding:6px 9px;cursor:pointer;}
.theme-toggle button.active{background:var(--accent);color:var(--accent-text);}
.search-wrap{position:relative;margin-bottom:10px;}
.search-wrap input{width:100%;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:15px;font-family:var(--sans);}
.search-wrap input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:6px 12px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;font-family:var(--sans);cursor:pointer;
  white-space:nowrap;}
.chip.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600;}
.add-toggle{width:100%;margin-bottom:10px;background:var(--surface);text-align:center;}
.add-panel{display:none;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.add-panel.open{display:flex;}
.add-panel input,.add-panel textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:14px;font-family:var(--sans);resize:vertical;}
.add-panel input:focus,.add-panel textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
.add-actions{display:flex;gap:8px;}
.card-actions-top{display:flex;gap:6px;align-items:flex-start;}
main{flex:1;padding:16px;max-width:920px;margin:0 auto;width:100%;}
.count-row{font-size:12px;color:var(--muted);font-family:var(--mono);margin:2px 2px 12px;}
.grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr;}}
.card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card-id{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.card-title{font-family:var(--serif);font-size:16.5px;margin:0;line-height:1.3;}
.star-btn{background:none;border:none;cursor:pointer;font-size:18px;color:var(--border);line-height:1;padding:2px;}
.star-btn.saved{color:var(--star);}
.card-tag{align-self:flex-start;font-size:10.5px;font-family:var(--mono);color:var(--accent);
  background:var(--surface2);padding:2px 8px;border-radius:999px;}
.card-text{font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--muted);
  white-space:pre-wrap;margin:0;max-height:6.3em;overflow:hidden;}
.card-text.expanded{max-height:none;}
.card-actions{display:flex;gap:8px;margin-top:2px;}
.btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text);font-size:12.5px;font-family:var(--sans);cursor:pointer;font-weight:600;}
.btn.copy{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.btn.copy.copied{background:#3ecf8e;border-color:#3ecf8e;color:#00251a;}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-family:var(--serif);font-size:16px;}
.load-more-wrap{display:none;justify-content:center;margin:6px 0 18px;}
.load-more-wrap .btn{flex:none;padding:10px 20px;}
footer{text-align:center;border-top:1px solid var(--border);padding:18px 12px 22px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;}
footer p{margin:0;font-size:11.5px;color:var(--muted);font-family:var(--mono);}
</style>
</head>
<body data-theme="dark">
<header class="top">
  <div class="title-row">
    <div>
      <p class="brand">Promax<span>.</span></p>
      <p class="subtitle">14,000+ prompts across 64 categories</p>
    </div>
    <div class="theme-toggle" id="themeToggle">
      <button data-t="dark">Dark</button>
      <button data-t="light">Light</button>
      <button data-t="oled">OLED</button>
      <button data-t="hc">HC</button>
    </div>
  </div>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search prompts, e.g. 'blog outline' or 'refactor'" autocomplete="off">
  </div>
  <button class="btn add-toggle" id="addToggleBtn">+ Add your own prompt</button>
  <div class="add-panel" id="addPanel">
    <input id="addTitle" placeholder="Title, e.g. 'Weekly Retro'" maxlength="80">
    <input id="addCategory" list="catList" placeholder="Category, e.g. 'Writing'" maxlength="40">
    <datalist id="catList"></datalist>
    <textarea id="addText" placeholder="Prompt text..." rows="4" maxlength="2000"></textarea>
    <div class="add-actions">
      <button class="btn copy" id="addSaveBtn">Save Prompt</button>
      <button class="btn" id="addCancelBtn">Cancel</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <p class="count-row" id="countRow"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No prompts match — try a different search or category.</div>
  <div class="load-more-wrap" id="loadMoreWrap">
    <button class="btn" id="loadMoreBtn">Load more</button>
  </div>
</main>
<footer>
  <p>&copy; <span id="year"></span> Manik Roy. All Rights Reserved.</p>
</footer>

    wrap.appendChild(b);
  });
  const fb = document.createElement("button");
  fb.className = "chip" + (state.fav ? " active":"");
  fb.textContent = "★ Favorites";
  fb.onclick = ()=>{ state.fav = !state.fav; visibleCount=PAGE_SIZE; renderAll(); };
  wrap.appendChild(fb);
  const catList = document.getElementById("catList");
  catList.innerHTML = categories().filter(c=>c!=="All").map(c=>`<option value="${esc(c)}">`).join("");
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return ALL.filter(p=>{
    if(state.fav && !favs.has(p.id)) return false;
    if(!state.fav && state.cat!=="All" && p.c!==state.cat) return false;
    if(q && !(p.t.toLowerCase().includes(q) || p.p.toLowerCase().includes(q) || p.c.toLowerCase().includes(q))) return false;
    return true;
  });
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderGrid(){
  const list = filtered();
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const shown = list.slice(0, visibleCount);
  document.getElementById("countRow").textContent =
    "Showing " + shown.length + " of " + list.length + " prompt" + (list.length===1?"":"s");
  grid.innerHTML = "";
  empty.style.display = list.length ? "none" : "block";
  const loadMoreWrap = document.getElementById("loadMoreWrap");
  loadMoreWrap.style.display = list.length > shown.length ? "flex" : "none";
  shown.forEach(p=>{
    const card = document.createElement("div");
    card.className = "card";
    const isFav = favs.has(p.id);
    const isCustom = p.id.startsWith("PC-");
    card.innerHTML = `
      <div class="card-top">
        <span class="card-id">${p.id}${isCustom?' · yours':''}</span>
        <div class="card-actions-top">
          ${isCustom?'<button class="star-btn delete-btn" aria-label="Delete prompt">🗑</button>':''}
          <button class="star-btn ${isFav?'saved':''}" aria-label="Toggle favorite">${isFav?'★':'☆'}</button>
        </div>
      </div>
      <span class="card-tag">${esc(p.c)}</span>
      <h3 class="card-title">${esc(p.t)}</h3>
      <pre class="card-text">${esc(p.p)}</pre>
      <div class="card-actions">
        <button class="btn expand">Expand</button>
        <button class="btn copy">Copy</button>
      </div>`;
    if(isCustom){
      card.querySelector(".delete-btn").onclick = ()=>{
        if(confirm("Delete this prompt? This can't be undone.")){
          CUSTOM = CUSTOM.filter(c=>c.id!==p.id);
          saveCustom(); rebuildAll(); renderAll();
        }
      };
    }
    card.querySelector(".star-btn:not(.delete-btn)").onclick = ()=>{
      if(isFav) favs.delete(p.id); else favs.add(p.id);
      saveFavs(); renderAll();
    };
    const textEl = card.querySelector(".card-text");
    const expandBtn = card.querySelector(".expand");
    expandBtn.onclick = ()=>{
      textEl.classList.toggle("expanded");
      expandBtn.textContent = textEl.classList.contains("expanded") ? "Collapse" : "Expand";
    };
    const copyBtn = card.querySelector(".copy");
    copyBtn.onclick = async ()=>{
      try{
        await navigator.clipboard.writeText(p.p);
      }catch(e){
        textEl.select && textEl.select();
      }
      copyBtn.textContent = "Copied!";
      copyBtn.classList.add("copied");
      setTimeout(()=>{ copyBtn.textContent="Copy"; copyBtn.classList.remove("copied"); }, 1400);
    };
    grid.appendChild(card);
    if(textEl.scrollHeight <= textEl.clientHeight + 2){
      expandBtn.style.display = "none";
    }
  });
}

function renderAll(){ renderChips(); renderGrid(); }

document.getElementById("search").addEventListener("input", e=>{
  state.q = e.target.value; visibleCount = PAGE_SIZE; renderGrid();
});

document.getElementById("loadMoreBtn").onclick = ()=>{
  visibleCount += PAGE_SIZE; renderGrid();
};

const addPanel = document.getElementById("addPanel");
const addTitle = document.getElementById("addTitle");
const addCategory = document.getElementById("addCategory");
const addText = document.getElementById("addText");
const addToggleBtn = document.getElementById("addToggleBtn");

function closeAddPanel(){
  addPanel.classList.remove("open");
  addToggleBtn.textContent = "+ Add your own prompt";
  addTitle.value = ""; addCategory.value = ""; addText.value = "";
}
addToggleBtn.onclick = ()=>{
  const opening = !addPanel.classList.contains("open");
  addPanel.classList.toggle("open", opening);
  addToggleBtn.textContent = opening ? "− Hide form" : "+ Add your own prompt";
  if(opening) addTitle.focus();
};
document.getElementById("addCancelBtn").onclick = closeAddPanel;
document.getElementById("addSaveBtn").onclick = ()=>{
  const t = addTitle.value.trim();
  const c = addCategory.value.trim() || "Custom";
  const p = addText.value.trim();
  if(!t || !p){
    alert("Please add a title and the prompt text before saving.");
    return;
  }
  const id = "PC-" + Date.now().toString(36) + Math.floor(Math.random()*100);
  CUSTOM.push({c, t, p, id});
  saveCustom(); rebuildAll();
  closeAddPanel();
  state.cat = "All"; state.fav = false; visibleCount = PAGE_SIZE;
  renderAll();
};

const themeBtns = document.querySelectorAll("#themeToggle button");
function setTheme(t){
  document.body.setAttribute("data-theme", t);
  themeBtns.forEach(b=>b.classList.toggle("active", b.dataset.t===t));
  localStorage.setItem(THEME_KEY, t);
}
themeBtns.forEach(b=> b.onclick = ()=> setTheme(b.dataset.t));
setTheme(localStorage.getItem(THEME_KEY) || "dark");

document.getElementById("year").textContent = new Date().getFullYear();

renderAll();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
</script>
